<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="180mm"
   height="50mm"
   viewBox="0 0 260 73"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="glassGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <radialGradient id="shineLight" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2"
        flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(14,8)">

    <!-- Receipt -->
    <g filter="url(#shadowLight)">
      <path
        d="M 6 8
           L 10 4 L 14 8 L 18 4 L 22 8 L 26 4 L 30 8 L 34 4 L 38 8 L 42 4 L 46 8
           L 46 46
           L 42 50 L 38 46 L 34 50 L 30 46 L 26 50 L 22 46 L 18 50 L 14 46 L 10 50 L 6 46
           Z"
        fill="#ffffff"/>

      <rect x="12" y="14" width="28" height="3" rx="1.5" fill="#64748b" opacity="0.45"/>
      <rect x="12" y="20" width="24" height="3" rx="1.5" fill="#64748b" opacity="0.45"/>
      <rect x="12" y="26" width="20" height="3" rx="1.5" fill="#64748b" opacity="0.45"/>
      <rect x="12" y="32" width="26" height="3" rx="1.5" fill="#64748b" opacity="0.45"/>

      <circle cx="16" cy="40" r="6.5" fill="#16a34a"/>
      <path
        d="M 12.8 40 L 15.1 42.2 L 19.8 36.9"
        stroke="#ffffff"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
    </g>

    <!-- Magnifier -->
    <g transform="translate(28,16)" filter="url(#shadowLight)">
      <circle cx="22" cy="18" r="16.5"
              fill="#f1f5f9"
              stroke="#334155"
              stroke-width="2.2"/>
      <circle cx="22" cy="18" r="13.2"
              fill="url(#glassGradLight)"/>
      <circle cx="18" cy="14" r="12.5"
              fill="url(#shineLight)"/>

      <!-- Chart -->
      <rect x="14" y="19" width="4" height="7" rx="1" fill="#16a34a"/>
      <rect x="20" y="16" width="4" height="10" rx="1" fill="#16a34a"/>
      <rect x="26" y="13" width="4" height="13" rx="1" fill="#16a34a"/>

      <path
        d="M 13.5 15.5 L 19.5 13.5 L 23.5 15.2 L 30.5 10.5"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

      <!-- Handle -->
      <path
        d="M 33 30 L 47 44"
        stroke="#334155"
        stroke-width="6"
        stroke-linecap="round"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(96,0)">
    <text
      x="0" y="41"
      font-family="Ubuntu, Inter, Arial, sans-serif"
      font-weight="700"
      font-size="26">
      <tspan fill="#2563eb">QR2</tspan>
      <tspan fill="#16a34a">Finance</tspan>
    </text>

    <text
      x="0" y="54"
      font-family="Ubuntu, Inter, Arial, sans-serif"
      font-size="9"
      fill="#64748b"
      letter-spacing="0.6">
      receipt analytics
    </text>
  </g>

</svg>

